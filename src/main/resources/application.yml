server:
  port: 8081
  servlet:
    context-path: /api
spring:
  application:
    name: ai-generator-mother-backend
# springdoc-openapi
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.gpjy.controller


